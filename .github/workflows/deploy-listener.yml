name: Deploy development
on:
  workflow_run:
    workflows: ["Release Workflow"]
    types: [completed]
permissions:
  contents: read
jobs:
  deploy:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Show forged trigger context
        run: |
          echo "PRIVILEGED DEPLOY JOB RAN"
          echo "upstream_name=${{ github.event.workflow_run.name }}"
          echo "upstream_event=${{ github.event.workflow_run.event }}"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "run_ref=${{ github.ref }}"
